appId: com.ausflow
---
# From Today with no saved profile: join E2E_PLATE by searching its registration. Local only.
- tapOn:
    id: "today-working-as"
- tapOn:
    id: "setup-plate"
- inputText: ${E2E_PLATE}
- tapOn:
    id: "setup-plate-match"
# The app dismisses the keyboard after a match; Enter does the same in case the field still has focus.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
# The E2E company has two drivers, so one must be chosen.
- scrollUntilVisible:
    element: ".*${E2E_DRIVER}.*"
    direction: DOWN
- tapOn: ".*${E2E_DRIVER}.*"
- tapOn:
    id: "setup-save"
# The on-board card (text "ON BOARD · <plate>" is split across nodes on iOS, so match the id).
- extendedWaitUntil:
    visible:
      id: "today-on-board"
    timeout: 15000
