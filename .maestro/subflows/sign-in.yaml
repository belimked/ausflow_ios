appId: com.ausflow
---
# SecureStore lives in the iOS keychain, which survives clearState, so wipe it to start signed out.
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- tapOn:
    id: "login-username"
- inputText: ${E2E_USERNAME}
# Tap the password field only once the keyboard has finished pushing the form up (an early tap misses).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "login-password"
- inputText: ${E2E_PASSWORD}
# "Go" on the password keyboard submits (hideKeyboard is unreliable on iOS).
- pressKey: Enter
# iOS may offer to save the password in a system sheet that covers the app; dismiss it when it shows up.
- extendedWaitUntil:
    visible: "Not Now|Good (morning|afternoon|evening).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening).*"
    timeout: 15000
