appId: com.ausflow
---
# SecureStore lives in the iOS keychain, which survives clearState, so wipe it to start signed out.
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- tapOn:
    id: "login-username"
- inputText: ${E2E_USERNAME}
# "Next" moves focus to the password field. Tapping it instead can miss while the keyboard pushes the form up.
- pressKey: Enter
- inputText: ${E2E_PASSWORD}
# "Go" on the password keyboard submits (hideKeyboard is unreliable on iOS).
- pressKey: Enter
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening).*"
    timeout: 30000
