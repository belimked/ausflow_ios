appId: com.ausflow
---
# SecureStore lives in the iOS keychain, which survives clearState, so wipe it to start signed out.
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- tapOn:
    id: "login-username"
- inputText: ${E2E_USERNAME}
# Never tap while the keyboard is up: the form moves and Maestro aims with a stale hierarchy. "Next" on the
# username keyboard moves focus to the password field; type only once that field reports focus.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "login-password"
      focused: true
    timeout: 5000
- inputText: ${E2E_PASSWORD}
# "Go" on the password keyboard submits (hideKeyboard is unreliable on iOS).
- pressKey: Enter
# iOS may offer to save the password in a system sheet that covers the app; dismiss it when it shows up.
- extendedWaitUntil:
    visible: "Not Now|Good (morning|afternoon|evening).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening).*"
    timeout: 15000
