appId: com.ausflow
---
# The "Save Password?" system sheet can appear a moment after sign-in. Give it a few seconds, tap "Not Now" if it is
# there, and wait until it has gone before anything else is tapped.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - extendedWaitUntil:
          notVisible: "Not Now"
          timeout: 10000
