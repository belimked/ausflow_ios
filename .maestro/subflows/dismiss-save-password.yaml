appId: com.ausflow
---
# The "Save Password?" system sheet can appear a moment after sign-in. Give it a few seconds, tap "Not Now" once it
# has settled (a tap during its animation misses), try once more if it is still there, and wait until it has gone.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Not Now"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          notVisible: "Not Now"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn:
                text: "Not Now"
                retryTapIfNoChange: true
      - extendedWaitUntil:
          notVisible: "Not Now"
          timeout: 10000
