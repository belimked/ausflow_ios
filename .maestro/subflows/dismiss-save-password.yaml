appId: com.ausflow
---
# The "Save Password?" system sheet can appear a moment after sign-in. iOS ignores taps on a sheet for a short
# moment after it is presented, so pause before each tap and try up to three times, then wait until it has gone.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - runFlow: tap-not-now.yaml
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - runFlow: tap-not-now.yaml
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - runFlow: tap-not-now.yaml
      - extendedWaitUntil:
          notVisible: "Not Now"
          timeout: 10000
