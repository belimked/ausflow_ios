appId: com.ausflow
name: Join a vehicle by searching its registration and see its on-board load on Today
tags:
  - auth
  - data
---
# Only the local driver/vehicle profile changes; nothing is written to UAT.
- runFlow: subflows/sign-in.yaml
- tapOn: "Choose driver & vehicle"
- tapOn:
    id: "setup-plate"
- inputText: ${E2E_PLATE}
- tapOn: ${E2E_PLATE}
- runFlow:
    when:
      visible: ${E2E_DRIVER}
    commands:
      - tapOn: ${E2E_DRIVER}
- tapOn:
    id: "setup-save"
- extendedWaitUntil:
    visible: "ON BOARD · ${E2E_PLATE}"
    timeout: 15000
