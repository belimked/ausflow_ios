appId: com.ausflow
name: Login screen validates input and shows server errors
tags:
  - smoke
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- assertVisible: "UAT environment"
- assertVisible: "Remember my username"
- assertVisible: "Forgot password\\?"
- tapOn:
    id: "login-submit"
- assertVisible: "Enter your username and password."
- tapOn:
    id: "login-username"
- inputText: "e2e-no-such-user"
# Never tap while the keyboard is up: the form moves and Maestro aims with a stale hierarchy. "Next" on the
# username keyboard moves focus to the password field. The iOS driver never reports `focused`, so give the focus
# change a moment (an optional wait that always times out), then check nothing leaked into the username field.
- pressKey: Enter
- extendedWaitUntil:
    notVisible:
      id: "login-username"
    timeout: 1500
    optional: true
- inputText: "not-the-password"
- assertVisible:
    id: "login-username"
    text: "^e2e-no-such-user$"
# "Go" on the password keyboard submits (hideKeyboard is unreliable on iOS).
- pressKey: Enter
- extendedWaitUntil:
    visible: "Invalid username or password"
    timeout: 30000
