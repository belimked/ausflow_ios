appId: com.ausflow
name: Sign in, see Today, History and the Me data summary, sign out
tags:
  - auth
---
- runFlow: subflows/sign-in.yaml
- assertVisible: ".*Scan device QR.*|.*PICKUP IN PROGRESS.*"
- assertVisible: "Pickups today"
# History lists pickups, offloads and transfers.
- tapOn: "History"
- tapOn: ".*Offloads.*"
- assertVisible: "No offloads yet|.* L · .*"
- tapOn: ".*Transfers.*"
- assertVisible: "No transfers yet|.* L · .* → .*"
- tapOn: "Me"
# Phase 5: nothing recorded offline, so the sync section is clear.
- assertVisible: ".*Up to date.*"
- assertVisible: ".*My details.*"
# Phase 0: facilities are now read from /state.
- assertVisible: ".*devices · .* facilities"
# Me is short: the button cannot be centred, but the screen keeps it clear of the tab bar.
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
- tapOn:
    id: "sign-out"
- assertVisible: "Sign out\\?"
- tapOn: "Yes, sign out"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
