appId: com.ausflow
name: Scan a device last assigned to another company, see it has no servicing company yet, start a pickup and cancel it
tags:
  - auth
  - data
  - write
env:
  # Seeded by ci/e2e-seed.json: legacy companyId is E2E Haulage (E2E-CO2), no completed pickup.
  E2E_OTHER_DEVICE: E2E-DEV-002
  E2E_OTHER_COMPANY: E2E Haulage
---
# Devices are no longer bound to a transport company: the E2E Transport driver may work on it.
# Cancelling deletes the pickup, so the run leaves no pickup behind on UAT.
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/join-by-plate.yaml

- tapOn:
    id: "today-scan"
# The simulator has no camera; use manual entry from whichever screen shows up.
- runFlow:
    when:
      visible: "Enter code instead"
    commands:
      - tapOn: "Enter code instead"
- runFlow:
    when:
      visible:
        id: "scan-manual"
    commands:
      - tapOn:
          id: "scan-manual"
- tapOn:
    id: "scan-code"
- inputText: ${E2E_OTHER_DEVICE}
- pressKey: Enter

- extendedWaitUntil:
    visible:
      id: "device-start"
    timeout: 20000
- assertNotVisible: ".*Not an authorised device.*"
# "Last serviced by" comes from the latest completed pickup only; the old assigned company is never shown.
- scrollUntilVisible:
    element:
      id: "device-serviced-by"
    direction: DOWN
    centerElement: true
- assertVisible: ".*Last serviced by.*"
- assertNotVisible: ".*${E2E_OTHER_COMPANY}.*"

- tapOn:
    id: "device-start"
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- extendedWaitUntil:
    visible: "IN PROGRESS.*"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "job-cancel"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "job-cancel"
- assertVisible: "Cancel this pickup\\?"
- tapOn: "Yes, cancel"
- extendedWaitUntil:
    visible:
      id: "today-scan"
    timeout: 30000
