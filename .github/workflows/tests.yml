name: Tests

# Unit tests run locally and here; functional (Maestro) tests only run here, on an iOS simulator.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci

  e2e:
    needs: unit
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Maestro needs Java 17+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate native project
        run: npx expo prebuild -p ios --clean

      # Release bundles the JS into the app, so no Metro server is needed. Simulator builds need no signing.
      - name: Build for simulator
        run: |
          xcodebuild -workspace ios/AusFlow.xcworkspace -scheme AusFlow -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Boot simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | first | .udid')
          [ -n "$UDID" ] && [ "$UDID" != null ] || { echo "::error::No iPhone simulator available"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/AusFlow.app"
          # Avoid the location prompt and give the pickup flow a fixed position (Adelaide CBD).
          xcrun simctl privacy "$UDID" grant location com.ausflow || true
          xcrun simctl location "$UDID" set -34.9285,138.6007 || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Flows that need an account or write to UAT only run when their secrets/variables are configured.
      - name: Run functional tests
        env:
          # The XCTest driver can take several minutes to start on a fresh hosted runner (default timeout is too short).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
          MAESTRO_CLI_NO_ANALYTICS: 1
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COMPANY: ${{ vars.E2E_COMPANY }}
          E2E_DRIVER: ${{ vars.E2E_DRIVER }}
          E2E_PLATE: ${{ vars.E2E_PLATE }}
          E2E_DEVICE: ${{ vars.E2E_DEVICE }}
        run: |
          # smoke: no account · auth: needs the E2E account · data: also needs the E2E_* test-data variables.
          TAGS=smoke
          EXCLUDE=data
          if [ -n "$E2E_USERNAME" ] && [ -n "$E2E_PASSWORD" ]; then
            TAGS="smoke,auth"
            if [ -n "$E2E_COMPANY" ] && [ -n "$E2E_PLATE" ] && [ -n "$E2E_DEVICE" ]; then EXCLUDE=none; fi
          else
            echo "::warning::E2E_USERNAME / E2E_PASSWORD secrets are not set; only smoke flows will run."
          fi
          [ "$EXCLUDE" = data ] && [ "$TAGS" != smoke ] && echo "::warning::E2E_COMPANY / E2E_PLATE / E2E_DEVICE variables are not set; flows tagged data are skipped."
          echo "Include: $TAGS · exclude: $EXCLUDE"
          maestro --device "$UDID" test .maestro \
            --include-tags "$TAGS" --exclude-tags "$EXCLUDE" \
            --format junit --output "$RUNNER_TEMP/maestro-report.xml" \
            --debug-output "$RUNNER_TEMP/maestro-debug" \
            -e E2E_USERNAME="$E2E_USERNAME" -e E2E_PASSWORD="$E2E_PASSWORD" \
            -e E2E_COMPANY="$E2E_COMPANY" -e E2E_DRIVER="${E2E_DRIVER:-__none__}" \
            -e E2E_PLATE="$E2E_PLATE" -e E2E_DEVICE="$E2E_DEVICE"

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-debug
          retention-days: 14
          if-no-files-found: ignore
